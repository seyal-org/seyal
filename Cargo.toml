[workspace]
members = [
    "crates/seyal-core",
    "crates/seyal-terminal",
    "crates/seyal-exec",
    "crates/seyal-protocol",
    "crates/seyal-runtime",
    "crates/seyal-render",
    "crates/seyal-client",
    "crates/seyal-agent-core",
    "crates/seyal-agent-protocol",
    "crates/seyal-agent-store",
    "crates/seyal-agent-backend",
    "crates/seyal-agent-client",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/mahboobmonnamd/seyal"

[workspace.lints.rust]
unsafe_code = "forbid"

# C ABI linked into Swift must never unwind across the boundary. Abort is the
# enforced panic policy for every bridge entry point (see seyal-client::ffi).
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
