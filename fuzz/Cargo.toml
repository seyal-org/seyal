[package]
name = "seyal-m001-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
seyal-agent-backend = { path = "../crates/seyal-agent-backend", features = ["fixture-host"] }
seyal-agent-core = { path = "../crates/seyal-agent-core" }
seyal-agent-protocol = { path = "../crates/seyal-agent-protocol" }
seyal-exec = { path = "../crates/seyal-exec" }
seyal-protocol = { path = "../crates/seyal-protocol" }
seyal-runtime = { path = "../crates/seyal-runtime" }
seyal-terminal = { path = "../crates/seyal-terminal" }

[[bin]]
name = "display_decode"
path = "fuzz_targets/display_decode.rs"
test = false
doc = false
bench = false

