version = 1

# Authoritative M001 fuzz registry. Every `active` row must name a libFuzzer
# binary (`libfuzzer`) whose campaign corpus is either `corpus` or an explicit
# `campaign_corpus`. Smoke adapters prove retained seeds; libFuzzer campaigns
# prove mutation coverage. See docs/engineering/M001-FUZZ-EVIDENCE.md.

