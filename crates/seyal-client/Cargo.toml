[package]
name = "seyal-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobenches = false

[features]
default = []
benchmark-instrumentation = []

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
seyal-core = { path = "../seyal-core" }
seyal-protocol = { path = "../seyal-protocol" }
seyal-render = { path = "../seyal-render" }

[dev-dependencies]
seyal-exec = { path = "../seyal-exec" }
seyal-runtime = { path = "../seyal-runtime", features = ["benchmark-instrumentation"] }

[lints.rust]
unsafe_code = "deny"

[[bench]]
name = "pass7_input_resize"
harness = false
required-features = ["benchmark-instrumentation"]

[[bench]]
name = "pass7_validation_matrix"
harness = false
required-features = ["benchmark-instrumentation"]

[[bench]]
name = "pass8_block_metadata"
harness = false
required-features = ["benchmark-instrumentation"]

[[bench]]
name = "app_root"
harness = false

[[bench]]
name = "m003_provisioning"
harness = false

[[bench]]
name = "m003_w7_lifecycle"
harness = false
