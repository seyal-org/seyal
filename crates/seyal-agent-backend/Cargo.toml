[package]
name = "seyal-agent-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
fixture-host = []
test-fault-injection = ["seyal-agent-store/test-fault-injection"]

[dependencies]
seyal-agent-core = { path = "../seyal-agent-core" }
seyal-agent-protocol = { path = "../seyal-agent-protocol" }
seyal-agent-store = { path = "../seyal-agent-store" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[[bin]]
name = "seyal-agent-backend"
path = "src/main.rs"

[[bin]]
name = "seyal-agent-backend-qualification"
path = "src/bin/seyal-agent-backend-qualification.rs"
required-features = ["fixture-host"]

[[test]]
name = "integration_path"
required-features = ["fixture-host"]

[[test]]
name = "session_bounds"
required-features = ["fixture-host"]

[[test]]
name = "concurrent_serve"
required-features = ["fixture-host"]

[[test]]
name = "concurrent_fault_persistence"
required-features = ["fixture-host"]

[[test]]
name = "session_principal_binding"
required-features = ["fixture-host"]

[[test]]
name = "agent_harness_fuzz_smoke"
required-features = ["fixture-host"]

[[test]]
name = "process_qualification"
required-features = ["fixture-host"]

[[test]]
name = "adapter_conformance"
required-features = ["fixture-host"]

[[test]]
name = "claude_code_adapter"
required-features = ["fixture-host"]

[lints.rust]
unsafe_code = "deny"
