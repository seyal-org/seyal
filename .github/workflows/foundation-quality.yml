name: Foundation Quality

on:
  # Fast PR gate only. Full XCUI / make bench / duplicated macOS make check run
  # on the scheduled Foundation Full Suite workflow. Docs stays path-filtered;
  # fuzz uses schedule/workflow_dispatch (registry smoke remains below).
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: foundation-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Governance structure
        run: make governance-check
      - name: PR Issue contract validator self-test
        run: python3 scripts/test-pr-issue-contract.py
      - name: PR owning Issue relationship
        if: github.event_name == 'pull_request'
        env:
          SEYAL_PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check-pr-issue-contract.py
      - name: Local documentation links
        run: python3 scripts/check-doc-links.py
      - name: Architecture layering
        run: python3 scripts/check-layering.py
      - name: Hot-path structural performance guardrails
        run: python3 scripts/check-hot-path.py
      - name: Benchmark contract guardrails
        run: python3 scripts/check-benchmark-contract.py
      - name: M002 performance evidence contract
        run: |
          python3 scripts/check-m002-performance-contract.py
          python3 scripts/check-m002-performance-contract.py --self-test
          python3 scripts/run-m002-performance-contract.py --self-test
      - name: Native UI test policy
        run: python3 scripts/check-ui-test-policy.py
      - name: Host product-fixture fence
        run: python3 scripts/check-host-product-fixtures.py
      - name: Thin-Swift product-authority boundary
        run: python3 scripts/check-thin-swift-boundary.py
      - name: Structural-debt ratchet
        run: |
          python3 scripts/check-structural-debt.py
          python3 scripts/check-structural-debt.py --self-test
      - name: Harness contracts
        run: python3 scripts/test-harnesses.py
      - name: Fuzz registry smoke
        run: python3 scripts/fuzz-smoke.py
      - name: Validator negative fixtures
        run: python3 scripts/test-ci-validators.py

  rust-and-harness-quality:
    name: rust-and-harness-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Bootstrap pinned Rust toolchain
        run: make bootstrap
      - name: Build production Rust surface
        run: make build
      - name: Format lint unit and repository checks
        run: make check

  native-macos-compile:
    name: native-macos-compile
    runs-on: macos-15
    # Slim PR compile gate only. Full make check / XCUI / make bench run on the
    # scheduled Foundation Full Suite so every-PR wall-clock stays short.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select pinned Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Bootstrap pinned Rust and native toolchains
        run: make bootstrap
      - name: Build Rust plus Seyal.app
        run: make build
