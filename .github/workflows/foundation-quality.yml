name: Foundation Quality

on:
  # PR-only: master is gated by required status checks on these jobs, so a
  # post-merge push re-run would duplicate the same Foundation suite without
  # adding merge protection. Docs stays path-filtered on push; fuzz uses
  # schedule/workflow_dispatch for non-PR evidence.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: foundation-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: classify-pr-changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed paths (unknown paths fail closed)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/classify-pr-paths.py --base "$BASE_SHA" --head "$HEAD_SHA"

  repository-policy:
    name: repository-policy
    needs: classify-changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Require successful path classification
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          CLASSIFIER_RESULT: ${{ needs.classify-changes.result }}
        run: test "$CLASSIFIER_RESULT" = success
      - name: Verify PR path classification (fail closed)
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/classify-pr-paths.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Governance structure
        run: make governance-check
      - name: PR Issue contract validator self-test
        run: python3 scripts/test-pr-issue-contract.py
      - name: PR owning Issue relationship
        if: github.event_name == 'pull_request'
        env:
          SEYAL_PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check-pr-issue-contract.py
      - name: Independent ADR acceptance review
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-adr-acceptance.py
      - name: Local documentation links
        run: python3 scripts/check-doc-links.py
      - name: Architecture layering
        run: python3 scripts/check-layering.py
      - name: Hot-path structural performance guardrails
        run: python3 scripts/check-hot-path.py
      - name: Benchmark contract guardrails
        run: python3 scripts/check-benchmark-contract.py
      - name: M002 performance evidence contract
        run: |
          python3 scripts/check-m002-performance-contract.py
          python3 scripts/check-m002-performance-contract.py --self-test
          python3 scripts/run-m002-performance-contract.py --self-test
      - name: Native UI test policy
        run: python3 scripts/check-ui-test-policy.py
      - name: Host product-fixture fence
        run: python3 scripts/check-host-product-fixtures.py
      - name: Thin-Swift product-authority boundary
        run: python3 scripts/check-thin-swift-boundary.py
      - name: Structural-debt ratchet
        run: |
          python3 scripts/check-structural-debt.py
          python3 scripts/check-structural-debt.py --self-test
      - name: Harness contracts
        run: python3 scripts/test-harnesses.py
      - name: Fuzz registry smoke
        run: python3 scripts/fuzz-smoke.py
      - name: Validator negative fixtures
        run: python3 scripts/test-ci-validators.py
      - name: PR risk policy self-test
        run: python3 scripts/test-pr-risk-policy.py
      - name: ADR acceptance self-test
        run: python3 scripts/test-adr-acceptance.py

  rust-and-harness-quality:
    name: rust-and-harness-quality
    needs: classify-changes
    if: (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && needs.classify-changes.result == 'success' && needs.classify-changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Bootstrap pinned Rust toolchain
        run: make bootstrap
      - name: Build production Rust surface
        run: make build
      - name: Format lint unit and repository checks
        run: make check
      - name: Benchmark harness smoke
        run: make bench

  native-macos-smoke:
    name: native-macos-smoke
    needs: classify-changes
    if: (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && needs.classify-changes.result == 'success' && needs.classify-changes.outputs.docs_only != 'true'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select pinned Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Bootstrap pinned Rust and native toolchains
        run: make bootstrap
      - name: Build Rust plus Seyal.app
        run: make build
      - name: Native format lint unit and repository checks
        run: make check
      - name: Unit, PTY, native smoke, XCTest and XCUIAutomation
        run: make test
      - name: Preserve native UI rendered evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seyal-macos-ui-xcresult
          path: target/macos-ui-tests.xcresult
          if-no-files-found: warn
          retention-days: 7
      - name: Native PTY benchmark baseline
        env:
          # GitHub-hosted macOS runners may be headless and cannot deliver
          # CAMetalDisplayLink callbacks. Interactive/local runs require the
          # presentation proxy and remain the acceptance measurement.
          SEYAL_REQUIRE_DISPLAY_LINK_BENCHMARK: "0"
          # This job validates the unsigned CI benchmark artifact, not a
          # distributable release. Keep the Release packaging contract
          # explicit without requiring a private Apple signing credential.
          SEYAL_CODESIGN_IDENTITY: "-"
        run: make bench
