# Grandfathered handwritten production debt at the #1021 freeze tip.
# Increasing ceiling_loc requires a narrowly scoped [[exception]] tied to an owning Issue.
# Reducing a grandfathered or [[exception]] file requires lowering ceiling_loc (or
# removing the entry once <= hard_loc) in the same change — silent headroom is rejected.
# [[cohesion_acknowledgement]] rows require acknowledged_loc in review_loc..hard_loc;
# growth past acknowledged_loc needs a fresh re-ack, and an ack is stale below review_loc.
# Generated/fixture exclusions use directory rules, `_generated`/`_test(s)` suffixes, or
# path-specific [[excluded]] rows with a reason — never rename to escape the gate.
